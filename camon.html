<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cảm ơn</title>
</head>
<body>

    <h1>Gửi ý kiến thành công!</h1>
    
    <!-- Đây là nơi tên và ý kiến sẽ hiện ra -->
    <p>Chào bạn <b id="hien_ten">...</b>,</p>
    <p>Cảm ơn bạn đã đóng góp ý kiến: "<i id="hien_ykien">...</i>" cho thư viện của nhà trường.</p>
    
    <p>Chúng tôi sẽ ghi nhận và phản hồi sớm nhất có thể.</p>
    
    <hr>
    <a href="Bai7-NV1.html">Quay lại trang đóng góp</a>

    <script>
        // Đoạn code nhỏ này giúp lấy thông tin từ thanh địa chỉ (URL)
        const params = new URLSearchParams(window.location.search);
        
        // Lấy tên và ý kiến dựa trên thuộc tính "name" ở file gốc
        const ten = params.get('ho_ten');
        const ykien = params.get('y_kien');

        // Hiển thị ra màn hình
        if(ten) document.getElementById('hien_ten').innerText = ten;
        if(ykien) document.getElementById('hien_ykien').innerText = ykien;
    </script>

</body>
</html>
