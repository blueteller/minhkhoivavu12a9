<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Biểu mẫu đăng ký</title>
</head>
<body>

    <!-- Sửa dòng này: Thêm action="camon2.html" -->
    <form action="camon2.html">
        <h3>Đăng kí tham gia Hội thao</h3>

        <p>
            Họ và tên: <input type="text" name="hoten">
        </p>

        <p>
            Địa chỉ email: <input type="text" name="email">
        </p>

        <p>
            <input type="radio" name="lop" value="10"> Lớp 10
            <input type="radio" name="lop" value="11"> Lớp 11
            <input type="radio" name="lop" value="12"> Lớp 12
        </p>

        <p>Tham dự môn:</p>
        
        <p>
            <input type="checkbox" name="mon" value="bongban"> Bóng bàn <br>
            <input type="checkbox" name="mon" value="caulong"> Cầu lông <br>
            <input type="checkbox" name="mon" value="covua"> Cờ vua
        </p>

        <p>
            <button type="submit">Đăng kí</button>
            <button type="reset">Huỷ bỏ</button>
        </p>
    </form>

</body>
</html>
