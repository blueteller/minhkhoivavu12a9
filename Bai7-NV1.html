<form>
  <h2>Đóng góp ý kiến cho thư viện của nhà trường</h2>
  
  <h3>1. Thông tin về người góp ý</h3>
  Họ và tên: <input type="text" name="fullname"><br>
  Địa chỉ email: <input type="email" name="email"><br>

  <h3>2. Đóng góp ý kiến</h3>
  Ý kiến đóng góp:<br>
  <textarea name="comment" rows="4" cols="50"></textarea><br>

  <p>Thể loại cần bổ sung thêm sách:</p>
  <input type="checkbox"> Truyện ngắn <br>
  <input type="checkbox"> Kĩ năng sống <br>
  <input type="checkbox"> Công nghệ thông tin <br>
  <input type="checkbox"> Truyện tranh <br>
  <input type="checkbox"> Lịch sử <br>

  <br>
  <button type="submit">Góp ý</button>
</form>
