<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đóng góp ý kiến</title>
</head>
<body>

    <h2>Đóng góp ý kiến cho thư viện của nhà trường</h2>

    <form action="#">
        <h3>1.Thông tin về người góp ý</h3>
        
        <div>
            <label for="fullname">Họ và tên: </label>
            <input type="text" id="fullname" name="fullname">
        </div>

        <div>
            <label for="email">Địa chỉ email: </label>
            <input type="email" id="email" name="email">
        </div>

        <h3>2.Đóng góp ý kiến</h3>

        <div style="display: flex; align-items: flex-start;">
            <label for="feedback">Ý kiến đóng góp: </label>
            <textarea id="feedback" name="feedback" rows="6" cols="50"></textarea>
        </div>
    </form>

</body>
</html>
