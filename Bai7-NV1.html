<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đóng góp ý kiến thư viện</title>
</head>
<body style="background-color: #004a99; color: black; padding: 20px;">

    <form action="camon.html" method="GET">
        <div style="background-color: #004a99; border: 1px solid white; padding: 20px;">
            <h2 style="color: black;">Đóng góp ý kiến cho thư viện của nhà trường</h2>

            <h3>1. Thông tin về người góp ý</h3>
            Họ và tên: <input type="text" name="ho_ten"><br><br>
            Địa chỉ email: <input type="email" name="email"><br>

            <h3>2. Đóng góp ý kiến</h3>
            Ý kiến đóng góp:<br>
            <textarea name="y_kien" rows="5" cols="50"></textarea>

            <p>Thể loại cần bổ sung thêm sách</p>
            <input type="checkbox" name="the_loai" value="truyen_ngan"> Truyện ngắn <br>
            <input type="checkbox" name="the_loai" value="ki_nang_song"> Kĩ năng sống <br>
            <input type="checkbox" name="the_loai" value="cntt"> Công nghệ thông tin <br>
            <input type="checkbox" name="the_loai" value="truyen_tranh"> Truyện tranh <br>
            <input type="checkbox" name="the_loai" value="lich_su"> Lịch sử <br>

            <br>
            <input type="submit" value="Góp ý">
        </div>
    </form>

</body>
</html>
