<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thời khóa biểu</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 20px;
        }

        h2{
            text-align: center;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th{
            background-color: #f2f2f2;
        }

        tr:hover{
            background-color: #e6f2ff;
        }
    </style>
</head>

<body>

<h2>THỜI KHÓA BIỂU</h2>

<table>
    <tr>
        <th>Thứ</th>
        <th>Tiết 1</th>
        <th>Tiết 2</th>
        <th>Tiết 3</th>
        <th>Tiết 4</th>
        <th>Tiết 5</th>
    </tr>

    <tr>
        <td>Thứ 2</td>
        <td>SH</td>
        <td>SH</td>
        <td>Sinh</td>
        <td>Lí</td>
        <td>Lí</td>
    </tr>

    <tr>
        <td>Thứ 3</td>
        <td>Hóa</td>
        <td>Anh</td>
        <td>Văn</td>
        <td>Hóa</td>
        <td>TDC</td>
    </tr>

    <tr>
        <td>Thứ 4</td>
        <td>Sử</td>
        <td>Sinh</td>
        <td>Toán</td>
        <td>Toán</td>
        <td>TDC</td>
    </tr>

    <tr>
        <td>Thứ 5</td>
        <td>Văn</td>
        <td>Toán</td>
        <td>Anh</td>
        <td>Sinh</td>
        <td>GDCD</td>
    </tr>

    <tr>
        <td>Thứ 6</td>
        <td>Hóa</td>
        <td>Tin</td>
        <td>GDTC</td>
        <td>GDTC</td>
        <td>Văn</td>
    </tr>

    <tr>
        <td>Thứ 7</td>
        <td>Toán</td>
        <td>Toán</td>
        <td>Văn</td>
        <td>Văn</td>
        <td>Nghỉ</td>
    </tr>
</table>

</body>
</html>
